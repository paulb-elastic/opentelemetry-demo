# Nginx reverse proxy config for the Embrace → Elastic mOTLP gateway.
#
# This file terminates TLS (via a Let's Encrypt certificate) and proxies
# HTTPS requests from Embrace to the OTel Collector running on localhost:4318.
#
# SETUP INSTRUCTIONS
# ------------------
# 1. Copy this file to /etc/nginx/sites-available/embrace-gateway
# 2. Replace every occurrence of YOUR_EC2_HOSTNAME with your actual EC2 public
#    DNS name, e.g. ec2-1-2-3-4.compute-1.amazonaws.com
# 3. Obtain a Let's Encrypt certificate:
#      sudo certbot --nginx -d YOUR_EC2_HOSTNAME
#    Certbot will write the ssl_certificate / ssl_certificate_key lines
#    automatically. If you run certbot first it will also create this file for
#    you; in that case just add the proxy block inside the existing 443 server.
# 4. Enable the site and reload Nginx:
#      sudo ln -s /etc/nginx/sites-available/embrace-gateway \
#                 /etc/nginx/sites-enabled/embrace-gateway
#      sudo nginx -t && sudo systemctl reload nginx
# 5. Verify auto-renewal is active:
#      sudo systemctl status certbot.timer

server {
    listen 443 ssl;
    server_name YOUR_EC2_HOSTNAME;

    # Populated by: sudo certbot --nginx -d YOUR_EC2_HOSTNAME
    ssl_certificate     /etc/letsencrypt/live/YOUR_EC2_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_EC2_HOSTNAME/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # OTLP payloads can be up to 4 MB (mOTLP max batch size).
    client_max_body_size 10m;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;

    location / {
        proxy_pass       http://127.0.0.1:4318;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect plain HTTP to HTTPS. Port 80 only needs to be open in the EC2
# security group during the initial Let's Encrypt certificate issuance.
# After the cert is issued you can close port 80; Certbot renews via port 443
# using the TLS-ALPN-01 challenge when Nginx is running.
server {
    listen 80;
    server_name YOUR_EC2_HOSTNAME;
    return 301 https://$host$request_uri;
}
